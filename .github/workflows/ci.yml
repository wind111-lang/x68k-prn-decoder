name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: iconv
          tools: composer
          coverage: none

      - name: Validate Composer metadata
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Test
        run: composer test

  windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test Windows CLI
        run: go test ./cmd/x68k-prn-decoder

      - name: Build Windows CLI
        run: go build -trimpath -ldflags "-X main.version=ci" -o x68k-prn-decoder-windows-amd64.exe ./cmd/x68k-prn-decoder

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: x68k-prn-decoder-windows-amd64
          path: x68k-prn-decoder-windows-amd64.exe
